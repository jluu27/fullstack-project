<!DOCTYPE html>
<html>

<head>
    <title>Create Build</title>
</head>

<body>

    <h1>Create a Build</h1>

    <form action="/create_build" method="POST">

        <label for="build_name">Build Name:</label>
        <input type="text" id="build_name" name="build_name">

        <br><br>

        <label for="description">Description:</label>
        <textarea id="description" name="description"></textarea>

        <br><br>

        <label for="character">Character:</label>
        <input type="text" id="character" name="character">

        <br><br>

        <button type="submit">Create Build</button>

    </form>

</body>

</html>
